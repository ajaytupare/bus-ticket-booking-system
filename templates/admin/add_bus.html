{% extends 'base.html' %}

{% block title %}Add New Bus - Admin - BusGo{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card card-custom border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="card-header bg-slate text-white p-4 d-flex justify-content-between align-items-center">
                    <h4 class="fw-bold mb-0"><i class="fa-solid fa-plus-circle text-primary-custom me-2"></i> Add New Bus Route</h4>
                    <a href="{{ url_for('admin.buses') }}" class="btn btn-outline-light btn-sm rounded-pill">Back to Bus List</a>
                </div>

                <div class="card-body p-4 p-md-5">
                    <form action="{{ url_for('admin.add_bus') }}" method="POST">
                        <div class="row g-3">
                            <!-- Bus Number -->
                            <div class="col-md-6">
                                <label for="bus_number" class="form-label fw-semibold text-slate">Bus Registration Number</label>
                                <input type="text" class="form-control rounded-3" id="bus_number" name="bus_number" placeholder="e.g. MH12AB1234" required>
                            </div>

                            <!-- Operator Name -->
                            <div class="col-md-6">
                                <label for="operator_name" class="form-label fw-semibold text-slate">Travel Operator Name</label>
                                <input type="text" class="form-control rounded-3" id="operator_name" name="operator_name" placeholder="e.g. Shree Travels" required>
                            </div>

                            <!-- Source -->
                            <div class="col-md-6">
                                <label for="source" class="form-label fw-semibold text-slate">Source City</label>
                                <input type="text" class="form-control rounded-3" id="source" name="source" placeholder="e.g. Kolhapur" required>
                            </div>

                            <!-- Destination -->
                            <div class="col-md-6">
                                <label for="destination" class="form-label fw-semibold text-slate">Destination City</label>
                                <input type="text" class="form-control rounded-3" id="destination" name="destination" placeholder="e.g. Pune" required>
                            </div>

                            <!-- Departure Time -->
                            <div class="col-md-6">
                                <label for="departure_time" class="form-label fw-semibold text-slate">Departure Time</label>
                                <input type="text" class="form-control rounded-3" id="departure_time" name="departure_time" placeholder="e.g. 08:00 AM" required>
                            </div>

                            <!-- Arrival Time -->
                            <div class="col-md-6">
                                <label for="arrival_time" class="form-label fw-semibold text-slate">Arrival Time</label>
                                <input type="text" class="form-control rounded-3" id="arrival_time" name="arrival_time" placeholder="e.g. 01:00 PM" required>
                            </div>

                            <!-- Travel Date -->
                            <div class="col-md-6">
                                <label for="travel_date" class="form-label fw-semibold text-slate">Travel Date</label>
                                <input type="date" class="form-control rounded-3" id="travel_date" name="travel_date" required>
                            </div>

                            <!-- Bus Type -->
                            <div class="col-md-6">
                                <label for="bus_type" class="form-label fw-semibold text-slate">Bus Category / Type</label>
                                <select class="form-select rounded-3" id="bus_type" name="bus_type" required>
                                    <option value="AC Sleeper">AC Sleeper</option>
                                    <option value="AC Seater">AC Seater</option>
                                    <option value="Non-AC Sleeper">Non-AC Sleeper</option>
                                    <option value="Non-AC Seater">Non-AC Seater</option>
                                </select>
                            </div>

                            <!-- Total Seats -->
                            <div class="col-md-6">
                                <label for="total_seats" class="form-label fw-semibold text-slate">Total Seats</label>
                                <input type="number" class="form-control rounded-3" id="total_seats" name="total_seats" value="40" min="10" max="60" required>
                            </div>

                            <!-- Ticket Price -->
                            <div class="col-md-6">
                                <label for="price" class="form-label fw-semibold text-slate">Price Per Seat (₹)</label>
                                <input type="number" step="0.01" class="form-control rounded-3" id="price" name="price" placeholder="e.g. 650.00" required>
                            </div>

                            <!-- Submit -->
                            <div class="col-12 mt-4">
                                <button type="submit" class="btn btn-primary-custom btn-lg w-100 rounded-3 fw-bold shadow">
                                    <i class="fa-solid fa-save me-2"></i> Save & Add Bus
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

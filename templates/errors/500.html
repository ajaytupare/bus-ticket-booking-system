{% extends 'base.html' %}

{% block title %}500 - Internal Server Error - BusGo{% endblock %}

{% block content %}
<div class="container py-5 text-center my-5">
    <div class="display-1 fw-bold text-danger mb-2">500</div>
    <h3 class="fw-bold text-slate mb-3">Internal Server Error</h3>
    <p class="text-secondary mb-4">Something went wrong while processing your request. Please try again later.</p>
    <a href="{{ url_for('user.index') }}" class="btn btn-primary-custom rounded-pill px-4 py-2 fw-bold">
        <i class="fa-solid fa-house me-2"></i> Return to Homepage
    </a>
</div>
{% endblock %}

{% extends 'base.html' %}

{% block title %}Register Account - BusGo{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card card-custom border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="card-header bg-slate text-white text-center py-4 border-0">
                    <i class="fa-solid fa-user-plus fa-3x text-primary-custom mb-2"></i>
                    <h3 class="fw-bold mb-0">Create an Account</h3>
                    <p class="text-muted-custom small mb-0">Join BusGo for seamless ticket booking</p>
                </div>
                <div class="card-body p-4 p-md-5">
                    <form action="{{ url_for('auth.register') }}" method="POST" id="registerForm">
                        <!-- Full Name -->
                        <div class="mb-3">
                            <label for="name" class="form-label fw-semibold text-slate">
                                <i class="fa-solid fa-user me-1 text-primary-custom"></i> Full Name
                            </label>
                            <input type="text" class="form-control form-control-lg fs-6 rounded-3" id="name" name="name" placeholder="e.g. Ramesh Patil" required>
                        </div>

                        <!-- Email -->
                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold text-slate">
                                <i class="fa-solid fa-envelope me-1 text-primary-custom"></i> Email Address
                            </label>
                            <input type="email" class="form-control form-control-lg fs-6 rounded-3" id="email" name="email" placeholder="name@example.com" required>
                        </div>

                        <!-- Phone -->
                        <div class="mb-3">
                            <label for="phone" class="form-label fw-semibold text-slate">
                                <i class="fa-solid fa-phone me-1 text-primary-custom"></i> Phone Number
                            </label>
                            <input type="tel" class="form-control form-control-lg fs-6 rounded-3" id="phone" name="phone" placeholder="e.g. 9876543210" pattern="[0-9]{10}" title="Please enter a 10-digit mobile number" required>
                        </div>

                        <!-- Password -->
                        <div class="mb-3">
                            <label for="password" class="form-label fw-semibold text-slate">
                                <i class="fa-solid fa-key me-1 text-primary-custom"></i> Password
                            </label>
                            <input type="password" class="form-control form-control-lg fs-6 rounded-3" id="password" name="password" minlength="6" placeholder="At least 6 characters" required>
                        </div>

                        <!-- Confirm Password -->
                        <div class="mb-4">
                            <label for="confirm_password" class="form-label fw-semibold text-slate">
                                <i class="fa-solid fa-check-double me-1 text-primary-custom"></i> Confirm Password
                            </label>
                            <input type="password" class="form-control form-control-lg fs-6 rounded-3" id="confirm_password" name="confirm_password" minlength="6" placeholder="Re-enter your password" required>
                        </div>

                        <!-- Submit -->
                        <button type="submit" class="btn btn-primary-custom btn-lg w-100 py-3 rounded-3 fw-bold shadow">
                            <i class="fa-solid fa-user-check me-2"></i> Register Account
                        </button>
                    </form>

                    <div class="mt-4 pt-3 border-top text-center text-secondary small">
                        Already have an account? 
                        <a href="{{ url_for('auth.login') }}" class="text-primary-custom fw-bold text-decoration-none ms-1">Log In</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
